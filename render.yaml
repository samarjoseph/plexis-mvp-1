# Render Blueprint specification for Plexis Zero-Budget (₹0) MVP Deployment
# https://render.com/docs/blueprint-spec

services:
  # ── Backend Web Service (Free Tier) ───────────────────────────────────────────
  - type: web
    name: plexis-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 120 --max-requests 1000 --max-requests-jitter 50"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AUTO_MIGRATE_DB
        value: "true"
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # ── Backblaze B2 Object Storage ──
      - key: STORAGE_PROVIDER
        value: "b2"
      - key: B2_APPLICATION_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_S3_ENDPOINT_URL
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_MAX_STORAGE_MB
        value: "9500"
      - key: MAX_UPLOAD_SIZE_MB
        value: "100"

  # ── Frontend Static Site (Optional on Render / or use Vercel) ─────────────────
  - type: static
    name: plexis-frontend
    region: oregon
    plan: free
    buildCommand: "npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: plexis-backend
          property: host
